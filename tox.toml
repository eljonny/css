env_list = [
    { prefix = "3.", start = 10 },
    { prefix = "test-3.", start = 10 },
    "coverage",
    "lint",
]

[env_run_base]
description = "build and install the package"

[env_base.test]
description = "run the test suite with pytest"
factors = [['3.10', '3.11', '3.12', '3.13', '3.14']]
deps = [
    "pytest>=9",
]
commands = [[
    "pytest",
    "--config-file=.hsf-pytest.toml",
]]

[env.coverage]
description = "run the test suite with pytest and record coverage"
deps = [
    "pytest",
    "coverage[toml]"
]
depends = ["3.*"]
commands = [
    ["coverage", "run", "--rcfile=.hsf-coveragerc.toml"],
    ["coverage", "combine"],
    ["coverage", "report", "--fail-under=80"],
]

[env.lint]
description = "run linters"
skip_install = true
deps = [
    "ruff",
    "flake8"
]
commands = [
    [
        "ruff", "check",
        {replace="posargs",default=[
                "--config",
                ".hsf-ruff.toml"
            ], extend=true}
    ],
    [
        "flake8"
    ]
]

