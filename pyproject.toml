[build-system]
requires = [
    "setuptools",
    "setuptools-scm[simple]",
    "wheel",
    "cython"
]
build-backend = "setuptools.build_meta"

[project]
name = "cs.app.osx.plist"
description = "This is a repackaging of the PyPI module with all the dependencies included. It has been improved to use libimobiledevice's libplist instead of calling the Apple-specific plutil CLI for binary plist parsing."
dynamic = ["version"]
readme = "README.md"
license = "LicenseRef-CSScriptsLic"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Other Environment",
    "Framework :: Flake8",
    "Framework :: Pytest",
    "Framework :: tox",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: File Formats",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
keywords = [
    "apple",
    "osx",
    "plist",
    "property list",
    "plistlib",
    "binary plist",
]
dependencies = [
    "icontract",
    "python-dateutil",
    "typeguard",
]
requires-python = ">= 3.10"
authors = [
  {name = "Cameron Simpson", email = "cs@cskk.id.au"},
  {name = "Jonathan Hyry", email = "jonathan.hyry@outlook.com"},
]
maintainers = [
  {name = "Jonathan Hyry", email = "jonathan.hyry@outlook.com"},
]

[project.urls]
PyPI = "https://pypi.org/user/cameron.simpson/"
Sourcehut = "https://hg.sr.ht/~cameron-simpson/css"
Docs = "http://www.cskk.ezoshosting.com/cs/css/"
Manual = "http://www.cskk.ezoshosting.com/cs/man/"
BitBucket = "https://bitbucket.org/cameron_simpson/css/"
Website = "http://www.cskk.ezoshosting.com/cs/"
# Cameron's GitHub Source Repository - upstream-upstream
GitHub = "https://github.com/cameron-simpson/css"
# Mirror upstream-upstream to sync HSF Working with - upstream
HSFGiteaUpstream = "https://git.hyrysoftwarefoundation.org/jhyry87/css"
# For contributing to upstream-upstream - origin-collab
HSFGitHubUpstream = "https://github.com/eljonny/css"
# HSF Working Repo - Packaging and working on cs.app.osx.plist - origin
HSFGitea = "https://git.hyrysoftwarefoundation.org/HyrySoftwareFoundation/css"
# HSF Working - PyPI Package Registry
HSFPyPI = "https://git.hyrysoftwarefoundation.org/HyrySoftwareFoundation/-/packages/pypi"

[tool.setuptools]
py-modules = [
    "cs.app.osx.plist",
    "cs.ansi_colour",
    "cs.context",
    "cs.dateutils",
    "cs.deco",
    "cs.gimmicks",
    "cs.lex", # Has tests
    "cs.logutils",
    "cs.obj", # Has tests
    "cs.pfx",
    "cs.py.func",
    "cs.py3._for3", # Has tests
    "cs.seq", # Has tests
    "cs.typingutils",
    "cs.x",
]

[tool.setuptools.package-dir]
"" = "lib/python"

