exclude = [
    '.hg',
    '.git',
    '.pyenv',
    '__pycache__',
    '.pytest_cache',
    '.ruff_cache',
    '.tox',
    '.venv',
    'dist',
    'logs',
    '**/__pycache__',
    '**/*.egg-info'
]

include = [
    "lib/python/cs/app/osx/plist.py",
    "lib/python/cs/ansi_colour.py",
    "lib/python/cs/context.py",
    "lib/python/cs/dateutils.py",
    "lib/python/cs/deco.py",
    "lib/python/cs/gimmicks.py",
    "lib/python/cs/lex.py",
    "lib/python/cs/logutils.py",
    "lib/python/cs/obj.py",
    "lib/python/cs/pfx.py",
    "lib/python/cs/py/func.py",
    "lib/python/cs/py3/_for3.py",
    "lib/python/cs/seq.py",
    "lib/python/cs/sh.py",
    "lib/python/cs/typingutils.py",
    "lib/python/cs/x.py",
]

indent-width = 2
line-length = 72
respect-gitignore = true
target-version = "py38"

[lint]
extend-select = [
    "C", # mccabe
    "D", # pydocstyle
    # warns in concise mode "DOC", # pydoclint
    "E", # pycodestyle
    "F", # pyflakes
    "FLY", # flynt
    "FURB", # refurb
    "I", # isort
    "N", # pep8-naming
    "NPY", # numpy specific rules
    "PD", # pandas-vet
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PL", # pylint
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactor
    "PLW", # pylint warning
    "RUF", # ruff specific rules
    "TRY", # tryceratops
    "UP", # pyupgrade
    "W", # warning
]
ignore = [
    'D200',
    'D205',
    'D208',
    'D210',
    'D212',
    'D213',
    'D214',
    'D300',
    'D400',
    'D401',
    'D405',
    'D406',
    'D407',
    'D411',
    'D412',
    'D413',
    'D415',
    'E111',
    'E114',
    'E402',
    'E501',
    'E731',
    'N801',
    'N802',
    'N816',
    'PERF203',
    'PLC0415',
    'PLR0911',
    'TRY003',
]
flake8-quotes.docstring-quotes = "single"
flake8-quotes.inline-quotes = "double"
flake8-quotes.multiline-quotes = "single"

[lint.mccabe]
max-complexity = 20

[lint.pylint]
max-args = 6
max-branches = 20
max-statements = 60

[format]
indent-style = "space"
quote-style = "preserve"

# Add .hsf-ruff.toml for package-specific linting -
# Only run linter on files related to cs.app.osx.plist -
