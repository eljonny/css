[run]
branch = true
command_line = "-m pytest --config-file=.hsf-pytest.toml"
context = "hsf-cs.app.osx.plist"
data_file = ".hsf-coverage"
include = [
    "lib/python/cs/app/osx/plist.py",
    "lib/python/cs/ansi_colour.py",
    "lib/python/cs/context.py",
    "lib/python/cs/dateutils.py",
    "lib/python/cs/deco.py",
    "lib/python/cs/gimmicks.py",
    "lib/python/cs/lex.py",
    "lib/python/cs/logutils.py",
    "lib/python/cs/obj.py",
    "lib/python/cs/pfx.py",
    "lib/python/cs/py/func.py",
    "lib/python/cs/py3/_for3.py",
    "lib/python/cs/seq.py",
    "lib/python/cs/sh.py",
    "lib/python/cs/typingutils.py",
    "lib/python/cs/x.py",
]

[report]
fail_under = 80.0
show_missing = true
skip_covered = false
skip_empty = false

[html]
directory = "hsf-coverage"
show_contexts = true
title = "HSF cs.app.osx.plist Coverage"

[xml]
output = "hsf-cs.app.osx.plist-coverage.xml"

[json]
output = "hsf-cs.app.osx.plist-coverage.json"
pretty_print = true
show_contexts = true

[lcov]
output = "hsf-cs.app.osx.plist-coverage.lcov"

# Add .hsf-coveragerc.toml for package coverage config -
